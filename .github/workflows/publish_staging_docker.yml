name: Publish Chatwoot staging docker image

# Builds and publishes an EE-enabled image on every push to main, so Coolify's staging
# environment always reflects what's on main without waiting for a GitHub Release (which is
# reserved for the production image, built by publish_ee_github_docker.yml).
#
# Single-platform (linux/amd64) only, unlike the release workflows: staging rebuilds on every
# push, so build speed matters more here than arm64 coverage.

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GITHUB_REPO: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ee"' >> docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.GITHUB_REPO }}:staging
